<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <style>
        body { background: #0b0f19; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #151c2c; padding: 30px; border-radius: 8px; border: 1px solid #2a3447; width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: 1px solid #2a3447; background: #0b0f19; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #38bdf8; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #0284c7; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🔒 Admin Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="handleLogin()">Login</button>
    </div>

    <script>
async function handleLogin() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    // Detect if running on local dev server (port 3000) vs production/backend
    const BASE_URL = window.location.port === '3000' ? 'http://localhost:5000' : '';

    try {
        const res = await fetch(`${BASE_URL}/api/admin/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (data.success) {
            localStorage.setItem('adminUser', JSON.stringify(data.admin));
            window.location.href = `${BASE_URL}/admin-security`;
        } else {
            alert(data.message);
        }
    } catch (err) {
        console.error("Login error:", err);
        alert("Failed to connect to backend server.");
    }
}
    </script>
</body>
</html>
